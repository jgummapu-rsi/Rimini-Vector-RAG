[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docling-slim"
version = "2.133.0"
description = "Pinned Docling runtime import closure for Rimini Vector RAG"
license = "MIT"
readme = "README.md"
requires-python = ">=3.12,<3.14"
# Minimal PDF/image CPU pipeline. Other formats use the application's existing
# source-aware loaders. No upstream CLI, audio, remote inference, or VLM extras.
dependencies = [
  "pydantic>=2.0,<3", "pydantic-settings>=2.14,<3",
  "docling-core==2.99.0", "docling-parse==7.22.1",
  "docling-ibm-models==4.0.3", "rapidocr==3.9.1",
  "filetype>=1.2,<2", "requests>=2.32.2,<3", "certifi>=2024.7.4",
  "pluggy>=1,<2", "tqdm>=4.65,<5", "langcodes>=3.5,<4",
  "numpy>=1.24,<3", "pillow>=10,<13", "rtree>=1.3,<2", "scipy>=1.6,<2",
  "pypdfium2>=4.30,!=4.30.1,<6", "torch>=2.2.2,<3", "torchvision>=0,<1",
  "accelerate>=1,<2", "huggingface-hub>=0.23,<2", "defusedxml>=0.7.1,<0.8",
  "onnxruntime>=1.7,<2",
]

[project.entry-points.docling]
docling_defaults = "docling.models.plugins.defaults"

[tool.hatch.build.targets.wheel]
packages = ["docling"]
