# Ruff config for CI. Deliberately a `ruff.toml` and not a `pyproject.toml`: this
# repo has no pyproject.toml, and introducing one -- even holding nothing but
# [tool.ruff] -- changes how pip/setuptools sees the directory. `ruff.toml` is
# inert to everything except ruff.
#
# CI STATUS: the `lint` job is ADVISORY (continue-on-error) as of CI v1. The
# target state is a blocking `ruff check` plus `ruff format --check`. Flip
# `.github/workflows/ci.yml`'s lint job to blocking once the backlog below is
# cleared -- the rule set here is chosen so that day is a small step, not a
# rewrite.

target-version = "py312"   # matches Dockerfile's `FROM python:3.12-slim`
line-length = 100          # measured: p95=84, p99=95 across tracked .py

# Research/demo code is held to a different bar than shipped app code. These are
# scratch surfaces -- benchmark drivers and narrative notebooks -- where unused
# imports and long lines are normal and churn constantly.
exclude = [
    "eval/",
    "notebooks/",
]

[lint]
# Conservative on purpose: real-bug and consistency rules only. No opinionated
# refactor families (SIM/TRY/PL/RUF) in v1 -- they were measured to fire ~40
# times across the codebase and each needs a human judgement call, which is
# exactly the kind of backlog that keeps a lint gate advisory forever.
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes -- undefined names, unused imports/variables
    "W",   # pycodestyle warnings
    "I",   # isort -- import ordering
    "B",   # flake8-bugbear -- likely bugs
    "UP",  # pyupgrade -- modernize for the py312 target
]

[lint.flake8-bugbear]
# FastAPI's whole dependency-injection model is "call an injectable in the
# argument default" -- `principal: Principal = Depends(get_principal)`. Bugbear's
# B008 flags every one of those (36 hits across app/api/, all of them this
# pattern, none of them a bug). Telling bugbear these calls are immutable is the
# upstream-recommended fix; blanket-ignoring B008 instead would also hide the
# real mutable-default bugs it exists to catch.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Path",
]

[lint.per-file-ignores]
# Tests legitimately import fixtures for their side effects and shadow names
# across the parametrized cases.
"tests/**" = ["B011"]

[format]
# Match the codebase's existing style rather than reformatting 88 modules on the
# first run. Values here are asserted by `ruff format --check` only once the
# lint job goes blocking.
quote-style = "double"
indent-style = "space"
