target-version = "py312"
line-length = 100
extend-exclude = [".venv*", ".claude", "data", "models", "graphify-out", "notebooks", "vendor"]

[lint]
select = ["E", "F", "W", "I", "B", "UP", "PLC0415"]
# The formatter wraps code; prose and SQL literals may exceed the line limit.
ignore = ["E501"]

[lint.extend-per-file-ignores]
# StrEnum changes string conversion; retain the persisted/public enum contract.
"app/shared/domain/models.py" = ["UP042"]

[lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Form", "fastapi.Path"]

[lint.per-file-ignores]
"tests/**" = ["B011"]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
