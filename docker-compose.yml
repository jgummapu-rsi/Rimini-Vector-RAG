# One Compose definition; select --profile development or --profile production.
# Keep the project name stable so existing named volumes retain their identity.
name: enterprise-rag

x-app-env: &app-env
  APP_ENV: docker
  DATA_DIR: data
  PLATFORM_TENANT_ID: ${PLATFORM_TENANT_ID:-}
  OPERATOR_USER_IDS: ${OPERATOR_USER_IDS:-[]}
  GATEWAY_ALLOWED_ORIGINS: ${GATEWAY_ALLOWED_ORIGINS:-[]}
  LITELLM_BASE_URL: ${LITELLM_BASE_URL:-}
  LITELLM_API_KEY: ${LITELLM_API_KEY:-}
  VISION_MODEL: ${VISION_MODEL:-claude-sonnet-5}
  CHAT_MODEL: ${CHAT_MODEL:-gpt-5-nano}
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-gateway}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-large}
  EMBEDDING_REVISION: ${EMBEDDING_REVISION:-text-embedding-3-large}
  EMBEDDING_DIM: ${EMBEDDING_DIM:-1536}
  EMBED_BATCH_SIZE: ${EMBED_BATCH_SIZE:-64}
  METADATA_EXTRACTION_ENABLED: ${METADATA_EXTRACTION_ENABLED:-true}
  RERANKER_PROVIDER: ${RERANKER_PROVIDER:-cross_encoder}
  CACHE_INDEX_NAME: ${CACHE_INDEX_NAME:-ans_te3_large_1536}
  PARSE_TIMEOUT_SECONDS: ${PARSE_TIMEOUT_SECONDS:-240}
  LAYOUT_ENABLED: ${LAYOUT_ENABLED:-true}
  LAYOUT_MODEL_PATH: /app/layout-models/doclayout_yolo_docstructbench_imgsz1024.pt
  LAYOUT_DEVICE: cpu
  LAYOUT_IMAGE_SIZE: ${LAYOUT_IMAGE_SIZE:-1024}
  LAYOUT_CONFIDENCE: ${LAYOUT_CONFIDENCE:-0.2}

x-app: &app
  read_only: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  pids_limit: 256
  mem_limit: 4g
  cpus: 2
  volumes:
    - hf_cache:/app/models
    - blob_data:/app/data
    - ./models/doclayout-yolo:/app/layout-models:ro
  # A host-side gateway tunnel may need scripts/gateway-relay.sh.
  extra_hosts:
    - "host.docker.internal:host-gateway"
    - "${GATEWAY_HOSTNAME:-litellm-gateway.delightfulpebble-214bf13c.eastus2.azurecontainerapps.io}:host-gateway"
  restart: unless-stopped

x-api: &api
  <<: *app
  tmpfs: ["/tmp:size=256m,mode=1777"]
  stop_grace_period: 120s

x-worker: &worker
  <<: *app
  tmpfs: ["/tmp:size=512m,mode=1777"]
  stop_grace_period: 300s
  command: ["python", "-m", "app.ingest.worker"]
  healthcheck:
    disable: true

x-development-env: &development-env
  <<: *app-env
  DATABASE_URL: postgresql://postgres:postgres@postgres:5432/rag_ingestion
  REDIS_URL: redis://redis:6379

x-development-dependencies: &development-dependencies
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy

x-production-env: &production-env
  <<: *app-env
  INITIALIZE_SCHEMA: "false"
  DATABASE_URL: ""
  DATABASE_URL_FILE: /run/secrets/runtime_database
  REDIS_URL: ""
  REDIS_URL_FILE: /run/secrets/runtime_redis
  LITELLM_API_KEY: ""
  LITELLM_API_KEY_FILE: /run/secrets/gateway_key
  LITELLM_BASE_URL: ${PRODUCTION_GATEWAY_ORIGIN:-}
  CACHE_INDEX_NAME: ${PRODUCTION_CACHE_INDEX:-ans_production}

services:
  postgres:
    profiles: [development]
    image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rag_ingestion
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init_vector.sql:/docker-entrypoint-initdb.d/10-vector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rag_ingestion"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports: ["127.0.0.1:55433:5432"]
    restart: unless-stopped

  redis:
    profiles: [development]
    image: redis/redis-stack-server@sha256:798ab84d9f266936b034ab11c4d04a2b8e4b441884c5aa7d17ac951eefdf742a
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports: ["127.0.0.1:56380:6379"]
    restart: unless-stopped

  api:
    <<: *api
    profiles: [development]
    build: .
    command: ["uvicorn", "app.api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    environment: *development-env
    ports: ["127.0.0.1:8000:8000"]
    depends_on: *development-dependencies

  worker:
    <<: *worker
    profiles: [development]
    build: .
    environment: *development-env
    depends_on: *development-dependencies

  api-production:
    <<: *api
    profiles: [production]
    extra_hosts: []
    image: ${RAG_RELEASE_IMAGE:-rag-release-not-configured:missing}
    environment:
      <<: *production-env
      HEALTHCHECK_HOSTNAME: ${PRODUCTION_TLS_HOSTNAME:-}
    command:
      - uvicorn
      - app.api.app:app
      - --host
      - 0.0.0.0
      - --port
      - "8443"
      - --ssl-certfile
      - /run/secrets/tls_certificate
      - --ssl-keyfile
      - /run/secrets/tls_key
      - --timeout-graceful-shutdown
      - "100"
    ports:
      - "${PRODUCTION_BIND_ADDRESS:-127.0.0.1}:${PRODUCTION_HTTPS_PORT:-8443}:8443"
    secrets: [runtime_database, runtime_redis, gateway_key, tls_certificate, tls_key]
    healthcheck:
      test: ["CMD", "python", "-m", "scripts.tls_healthcheck"]
      start_period: 180s
      timeout: 8s

  worker-production:
    <<: *worker
    profiles: [production]
    extra_hosts: []
    image: ${RAG_RELEASE_IMAGE:-rag-release-not-configured:missing}
    environment: *production-env
    secrets: [runtime_database, runtime_redis, gateway_key]

# Empty placeholders permit development config validation without production files.
# Production requires real mounted credentials; empty secrets fail at app startup.
secrets:
  runtime_database:
    file: ${RUNTIME_DATABASE_SECRET:-/dev/null}
  runtime_redis:
    file: ${RUNTIME_REDIS_SECRET:-/dev/null}
  gateway_key:
    file: ${GATEWAY_KEY_SECRET:-/dev/null}
  tls_certificate:
    file: ${TLS_CERTIFICATE_FILE:-/dev/null}
  tls_key:
    file: ${TLS_KEY_FILE:-/dev/null}

volumes:
  pgdata:
  redisdata:
  hf_cache:
  blob_data:
